name: build-apk

# 手机上编不动 native（NDK 只有 x86_64 主机工具链），所以把整条构建搬到这里。
# 第三方源码（quickjs / android_openssl / llama.cpp）不进仓库，由本流程运行时拉。

on:
  workflow_dispatch:
    inputs:
      abis:
        description: '要编的 ABI，逗号分隔（arm64-v8a 或 arm64-v8a,armeabi-v7a）'
        required: false
        default: 'arm64-v8a'
        type: string
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      NDK_VERSION: '28.2.13676358'
      CMAKE_VERSION: '3.22.1'
      BUILD_TOOLS: '36.0.0'
      ABIS: ${{ inputs.abis || 'arm64-v8a' }}
      # 第三方源码钉死到 commit：既能复现，也让 .cxx 缓存有稳定的失效边界
      QUICKJS_SHA: 'e585640ffa2cf88ce7c2d587583c6fe15928ec2f'
      OPENSSL_SHA: 'b71f1470962019bd89534a2919f5925f93bc5779'
      LLAMA_SHA: '6f311d7ad63dce97a3ad1deaafb7cc044bb8c26c'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android：它会去装 "tools" 这个已下架的包，
      # 在 runner 自带的 cmdline-tools 16 上直接报 Failed to find package 'tools'。
      # ubuntu-24.04 镜像本来就带 SDK，直接用现成的 sdkmanager。
      - name: Install SDK packages
        run: |
          set -eux
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then
            SDKM="$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          fi
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          # 已存在就跳过：重装会刷新 NDK 头文件 mtime，.cxx 缓存直接失效
          if [ -d "$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" ] && [ -d "$ANDROID_SDK_ROOT/cmake/${CMAKE_VERSION}" ]; then
            echo "NDK ${NDK_VERSION} / CMake ${CMAKE_VERSION} 已在，跳过安装"
          else
            "$SDKM" "platform-tools" "build-tools;${BUILD_TOOLS}" \
                    "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"
          fi
          # compileSdk=37：SDK 仓库里可能是 android-37，也可能是小节号目录 android-37.0
          for p in "platforms;android-37" "platforms;android-37.0" "platforms;android-36"; do
            if "$SDKM" "$p" > /dev/null 2>&1; then echo "platform: $p"; break; fi
          done
          "$SDKM" --list_installed

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # .cxx 缓存试过一版：ninja 只看 mtime，NDK 每次重装刷新 sysroot 头文件，
      # 119 个目标仍会重编 112 个，收益为零。换成 ccache——它按预处理内容寻址，
      # 头文件 mtime 怎么变都不影响命中。
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ccache
          key: ccache-${{ runner.os }}-${{ env.ABIS }}-ndk${{ env.NDK_VERSION }}-l${{ env.LLAMA_SHA }}-${{ hashFiles('app/src/main/cpp/**', 'app/src/main/rust/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.ABIS }}-ndk${{ env.NDK_VERSION }}-l${{ env.LLAMA_SHA }}-
            ccache-${{ runner.os }}-${{ env.ABIS }}-

      # 1.18 起 Rust 内核带外部依赖（aes-gcm / hkdf / serde …），cargo 自己管增量，
      # 把它的 target 目录缓存住，冷启动就不必重新编依赖树
      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: /home/runner/.bcx-rust-target
          key: cargo-${{ runner.os }}-${{ env.ABIS }}-${{ hashFiles('app/src/main/rust/Cargo.lock', 'app/src/main/rust/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.ABIS }}-

      - name: Fetch third-party sources
        run: |
          set -eux
          TP=app/src/main/cpp/_third_party
          mkdir -p "$TP"
          # 仓库 .gitignore 排除了 _third_party/，CMakeLists 直接从这些目录取源码
          fetch() { # $1=url $2=dir $3=commit
            git init -q "$2"
            git -C "$2" remote add origin "$1"
            git -C "$2" fetch -q --depth 1 origin "$3"
            git -C "$2" checkout -q FETCH_HEAD
            git -C "$2" log -1 --oneline
          }
          fetch https://github.com/bellard/quickjs      "$TP/quickjs"                "$QUICKJS_SHA"
          fetch https://github.com/KDAB/android_openssl  "$TP/android_openssl-master" "$OPENSSL_SHA"
          fetch https://github.com/ggml-org/llama.cpp    "$TP/llama.cpp"              "$LLAMA_SHA"
          # OpenCL 头文件与 stub 不拉：CMake 检测不到就自动退回纯 CPU
          printf '%s\n' '--- quickjs 必需源文件 ---'
          ls "$TP/quickjs"/{quickjs.c,dtoa.c,libregexp.c,libunicode.c,cutils.c}
          printf '%s\n' '--- openssl arm64 静态库 ---'
          ls "$TP/android_openssl-master/ssl_3/arm64-v8a"

      # 1.18 起 Rust 内核（baicodex crate）以 staticlib 接进 CMake，需要 Android target 的 std
      - name: Add Rust Android target
        run: |
          set -eux
          if ! command -v rustup > /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup target add aarch64-linux-android
          rustc --version

      # 上游从 1.18 起 debug 也复用 release 签名配置；没有 keystore 会出未签名包，安装报「应用未安装」。
      # 自用分支固定用仓库里的 signing/baicodex-ci.jks：签名稳定，才能覆盖安装不卸载。
      - name: Write local.properties + signing
        run: |
          set -eux
          PASS="baicodex-ci"
          ALIAS="baicodex"
          if [ -f signing/baicodex-ci.jks ]; then
            KS="$PWD/signing/baicodex-ci.jks"
            echo "签名：使用仓库内的固定 keystore（升级可覆盖安装）"
          else
            KS="$PWD/ci-release.jks"
            keytool -genkeypair -keystore "$KS" -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=baicodex CI, O=baicodex, C=CN" > /dev/null
            echo "::warning::没有固定 keystore，本次签名是临时的，装之前必须先卸载旧版"
          fi
          {
            echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
            echo "cmake.dir=${ANDROID_SDK_ROOT}/cmake/${CMAKE_VERSION}"
            echo "stringfog.key=${{ secrets.STRINGFOG_KEY }}"
            echo "baicodex.aes.key=${{ secrets.BAICODEX_AES_KEY }}"
            echo "bai.sign.store=$KS"
            echo "bai.sign.storePass=$PASS"
            echo "bai.sign.alias=$ALIAS"
            echo "bai.sign.keyPass=$PASS"
          } > local.properties
          # 不打印密钥，只看键名
          cut -d= -f1 local.properties
          ls -l "$KS"

      - name: Build debug APK
        env:
          BAI_CCACHE: '1'
          CCACHE_DIR: /home/runner/.cache/ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: '1'
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 2G
        run: |
          set -eux
          command -v ccache > /dev/null || sudo apt-get install -y ccache
          ccache --version | head -1
          ccache -z
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug \
            -Pbai.abis="${ABIS}" \
            -Pandroid.native.buildOutput=verbose \
            --console=plain \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8" \
            --stacktrace
          ccache -s || true

      - name: List APK
        run: |
          find app/build/outputs/apk -name '*.apk' -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: baicodex-debug-${{ github.sha }}
          # 分包模式下 AGP 还会额外产出一个 app-universal-debug.apk，
          # 对我们只是把同样的东西再打包一遍，排除掉能省一半流量
          path: |
            app/build/outputs/apk/debug/*.apk
            !app/build/outputs/apk/debug/app-universal-debug.apk
          if-no-files-found: error
          retention-days: 14
